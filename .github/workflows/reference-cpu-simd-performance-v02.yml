name: Reference CPU SIMD Performance Evaluation v0.2

on:
  pull_request:
    paths:
      - "Performance/**"
      - "Framework/**"
      - "Materials/**"
      - ".github/workflows/reference-cpu-simd-performance-v02.yml"
  workflow_dispatch:

jobs:
  evaluate-reference-cpu-simd-v02:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run corrected CPU SIMD performance evaluation
        run: >-
          dotnet run
          --project Performance/ThermoCore.ReferenceSimdPerformanceV02.csproj
          --configuration Release
