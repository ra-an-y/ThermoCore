name: RQ-ISO-001 S2

on:
  pull_request:
    paths:
      - 'Research/05_Research_Questions/Execution/RQ_ISO_001_S2/**'
      - 'Research/05_Research_Questions/RQ_ISO_001_S2_Scenario_Freeze_v0.1.md'
      - 'Research/05_Research_Questions/RQ_ISO_001_S2_Result_v0.1.md'
      - '.github/workflows/rq-iso-001-s2.yml'
  workflow_dispatch:

jobs:
  s2-hysteresis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Execute S2 hysteresis comparison
        run: dotnet run --project Research/05_Research_Questions/Execution/RQ_ISO_001_S2/ThermoCore.RQISO001.S2.csproj --configuration Release
