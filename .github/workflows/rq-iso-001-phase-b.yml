name: RQ-ISO-001 Phase B

on:
  pull_request:
    paths:
      - 'Research/05_Research_Questions/Execution/RQ_ISO_001_Phase_B/**'
      - 'Research/05_Research_Questions/RQ_ISO_001_Phase_B_Result_v0.1.md'
      - '.github/workflows/rq-iso-001-phase-b.yml'
  workflow_dispatch:

jobs:
  phase-b-s0-s1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Execute S0-S1 negative control
        run: dotnet run --project Research/05_Research_Questions/Execution/RQ_ISO_001_Phase_B/ThermoCore.RQISO001.PhaseB.csproj --configuration Release
